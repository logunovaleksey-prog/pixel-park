<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Сетка · Уровень 1</title>

<style>
/* Layout: one-screen phone app. Header (lecture tag + glitch title + stats) → isometric tile canvas → event prompt card. Single dark "digital avant-garde" look on purpose. */
:root{
  --void:#07060f; --void2:#100c24; --glass:rgba(22,17,52,.72); --edge:rgba(160,140,255,.22);
  --ink:#f3f0ff; --muted:#a49cd0;
  --mag:#ff2bd6; --cyan:#34f5ff; --lime:#c6ff3d; --violet:#7b5cff; --red:#ff3b5c;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate;
  background:
    radial-gradient(70% 45% at 100% 0%,rgba(255,43,214,.28),transparent 70%),
    radial-gradient(60% 40% at 0% 35%,rgba(52,245,255,.16),transparent 70%),
    radial-gradient(80% 50% at 50% 110%,rgba(123,92,255,.35),transparent 70%),
    var(--void)}
.app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}

header{flex:none;display:flex;flex-direction:column;gap:6px;padding-block:14px 4px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{font-family:var(--f-mono);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--cyan);display:flex;align-items:center;gap:8px}
.tag i{width:7px;height:7px;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.demo{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.12em;padding:5px 8px;border:1px solid var(--edge);border-radius:6px;color:var(--muted)}

.glitch{position:relative;margin:2px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(44px,15vw,84px);line-height:.92;letter-spacing:-.02em;
  background:linear-gradient(95deg,#fff 0%,#ffd6f6 35%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;-webkit-background-clip:initial;background:none}
.glitch::before{color:var(--mag);transform:translate(3px,0);mix-blend-mode:screen;opacity:.85;clip-path:inset(12% 0 64% 0);animation:g1 3.2s infinite steps(1)}
.glitch::after{color:var(--cyan);transform:translate(-3px,0);mix-blend-mode:screen;opacity:.85;clip-path:inset(58% 0 18% 0);animation:g2 2.7s infinite steps(1)}
@keyframes g1{0%{clip-path:inset(12% 0 64% 0);transform:translate(3px,0)}18%{clip-path:inset(40% 0 38% 0);transform:translate(-5px,0)}20%{clip-path:inset(80% 0 4% 0);transform:translate(6px,0)}22%,100%{clip-path:inset(12% 0 64% 0);transform:translate(3px,0)}}
@keyframes g2{0%{clip-path:inset(58% 0 18% 0);transform:translate(-3px,0)}61%{clip-path:inset(6% 0 76% 0);transform:translate(5px,0)}63%{clip-path:inset(30% 0 52% 0);transform:translate(-6px,0)}65%,100%{clip-path:inset(58% 0 18% 0);transform:translate(-3px,0)}}
.sub{margin:0;font-weight:600;font-size:15px;color:#d9d3ff}
.stats{display:flex;align-items:center;gap:12px;margin-top:4px}
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;max-width:30px;height:5px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .3s,box-shadow .3s}
.dots i.on{background:var(--lime);box-shadow:0 0 8px rgba(198,255,61,.6)}
.lives{display:flex;gap:5px;align-items:center;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--muted)}
.lives b{width:11px;height:11px;background:var(--mag);box-shadow:0 0 8px var(--mag);transform:rotate(45deg);transition:all .3s}
.lives b.off{background:transparent;box-shadow:none;outline:1.5px solid rgba(255,255,255,.25)}

.stage{flex:1;min-height:0;position:relative}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:var(--f-mono);font-weight:800;font-size:13px;letter-spacing:.04em;padding:8px 12px;border-radius:8px;background:rgba(7,6,15,.8);border:1px solid var(--edge);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.toast.ok{color:var(--lime);border-color:rgba(198,255,61,.4)}
.toast.bad{color:#ff8fb0;border-color:rgba(255,59,92,.5)}

.prompt{flex:none;margin-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));margin-bottom:max(14px,env(safe-area-inset-bottom,0px));
  position:relative;padding:14px 16px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;gap:6px}
.prompt::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--mag),var(--cyan),var(--lime))}
.k{font-family:var(--f-mono);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--lime)}
.ev{margin:0;font-weight:600;font-size:clamp(16px,4.4vw,19px);line-height:1.32;text-wrap:pretty}
.hint{margin:0;font-size:13px;color:var(--muted)}

.ov{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:20px;background:rgba(7,6,15,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{width:min(100%,360px);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px 20px;border-radius:24px;background:linear-gradient(160deg,rgba(40,26,90,.95),rgba(14,10,34,.95));border:1px solid var(--edge)}
.card h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,7vw,32px);line-height:1.05;text-wrap:balance}
.card p{margin:0;color:#d9d3ff}
.next{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;background:rgba(198,255,61,.08);border:1px solid rgba(198,255,61,.35)}
.next .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--lime);color:#14200a;font-family:var(--f-display);font-weight:900}
.next small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--lime)}
.next b{font-weight:700}
.btn{font-family:var(--f-display);font-weight:700;font-size:15px;color:#0d0820;background:linear-gradient(90deg,var(--cyan),var(--lime));padding:13px 24px;border-radius:14px;box-shadow:0 0 24px rgba(52,245,255,.35)}
.btn:active{transform:translateY(2px)}
@media (min-width:760px){.prompt{width:min(640px,calc(100% - 28px));align-self:center}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>

<div class="app" id="app">
  <header>
    <div class="row"><span class="tag"><i></i>ЛЕКЦИЯ 01 / 08</span><span class="demo">ДЕМО</span></div>
    <h1 class="glitch" data-t="СЕТКА">СЕТКА</h1>
    <p class="sub">Что такое компьютерная графика. История</p>
    <div class="stats">
      <div class="dots" id="dots"></div>
      <div class="lives" id="lives" aria-label="Жизни"></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Игровое поле: парящие плиты с годами"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <section class="prompt" aria-live="polite">
    <span class="k" id="k">ШАГ 1 · НАЙДИ ГОД СОБЫТИЯ</span>
    <p class="ev" id="ev"></p>
    <p class="hint" id="hint">Прыгай на соседнюю плиту с правильным годом. Ошибка ломает пиксель.</p>
  </section>

  <div class="ov" id="ov" hidden></div>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- level data ---------- */
const G=[
  [null,null,1977,"X",null],
  [null,1960,1995,2002,2012],
  [1989,1975,1982,2008,null],
  [1968,1972,1957,null,null],
  [1991,1963,1951,1980,null],
  [null,1937,"S",1969,null]
];
const ROWS=G.length,COLS=G[0].length;
const PATH=[[5,2],[4,2],[4,1],[3,1],[2,1],[2,2],[1,2],[1,3],[0,3]];
const EVENTS=[
  "Компьютер Whirlwind в MIT впервые выводит изображение на экран в реальном времени.",
  "Айвен Сазерленд создаёт Sketchpad: первую программу, где рисуют прямо на экране световым пером.",
  "Выходит Pong, одна из первых массовых видеоигр с графикой на экране.",
  "Мартин Ньюэлл моделирует «чайник Юта», самый знаменитый тестовый 3D-объект.",
  "Фильм «Трон» становится одним из первых фильмов с масштабной компьютерной графикой.",
  "«История игрушек»: первый полнометражный мультфильм, целиком созданный на компьютере.",
  "Blender становится бесплатным и открытым, им пользуются до сих пор."
];
const STEPS=EVENTS.length;

/* ---------- state ---------- */
let S;
function reset(){
  S={step:0,lives:3,visited:new Set(["5,2"]),jump:null,shake:0,glitch:0,bad:null,badT:0,done:false,t:0};
  renderUI();$("#ov").hidden=true;
}
const key=(r,c)=>r+","+c;
const adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;

/* ---------- UI ---------- */
const dots=$("#dots");dots.innerHTML="<i></i>".repeat(STEPS);
function renderUI(){
  dots.querySelectorAll("i").forEach((d,i)=>d.classList.toggle("on",i<S.step));
  $("#lives").innerHTML=[0,1,2].map(i=>`<b class="${i<S.lives?"":"off"}"></b>`).join("");
  if(S.step<STEPS){
    $("#k").textContent=`ШАГ ${S.step+1} ИЗ ${STEPS} · НАЙДИ ГОД СОБЫТИЯ`;
    $("#ev").textContent=EVENTS[S.step];
    $("#hint").textContent="Прыгай на соседнюю плиту с правильным годом. Ошибка ломает пиксель.";
  }else{
    $("#k").textContent="ВСЕ СОБЫТИЯ НА МЕСТЕ";
    $("#ev").textContent="Портал на уровень 2 «Вектор» открыт. Прыгни в него!";
    $("#hint").textContent="Портал светится на соседней плите.";
  }
}
let toastT=0;
function toast(msg,kind){const t=$("#toast");t.textContent=msg;t.className="toast show "+(kind||"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",1400);}

/* ---------- geometry ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d"),stage=$("#stage");
let W=0,H=0,TW=60,TH=30,DEP=10,OX=0,OY=0;
function fit(){
  const r=stage.getBoundingClientRect();if(r.width<10||r.height<10)return;
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);W=r.width;H=r.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  TW=Math.min(W*0.95/4.5,H/3.3,130);TH=TW/2;DEP=TW*0.2;
  OX=W/2+TW/4;OY=H/2-5*TH/2+TW*0.1;
}
const ro=window.ResizeObserver?new ResizeObserver(fit):null;if(ro)ro.observe(stage);else addEventListener("resize",fit);
function pos(r,c){return[OX+(c-r)*TW/2,OY+(c+r)*TH/2];}
function floatY(r,c){return reduced?0:Math.sin(S.t*1.3+r*1.7+c*1.1)*TW*0.025;}

/* ---------- drawing ---------- */
const ICO=(()=>{const p=(1+Math.sqrt(5))/2,v=[];[[-1,p],[1,p],[-1,-p],[1,-p]].forEach(([a,b])=>{v.push([a,b,0],[0,a,b],[b,0,a]);});
  const e=[];for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++){const d=Math.hypot(v[i][0]-v[j][0],v[i][1]-v[j][1],v[i][2]-v[j][2]);if(Math.abs(d-2)<0.01)e.push([i,j]);}return{v,e};})();
const SPECKS=Array.from({length:36},(_,i)=>[(i*97.3)%1,(i*57.1+0.3)%1,1+(i%3),i%4]);
function wire(cx,cy,R,rx,ry,col,alpha){
  const pts=ICO.v.map(([x,y,z])=>{let X=x*Math.cos(ry)+z*Math.sin(ry),Z=-x*Math.sin(ry)+z*Math.cos(ry);let Y=y*Math.cos(rx)-Z*Math.sin(rx);Z=y*Math.sin(rx)+Z*Math.cos(rx);const k=3.4/(3.4+Z*0.35);return[cx+X*R*k,cy+Y*R*k,Z];});
  ctx.lineWidth=1.2;
  for(const [a,b] of ICO.e){const z=(pts[a][2]+pts[b][2])/2;ctx.strokeStyle=col;ctx.globalAlpha=alpha*(0.35+0.65*(z+1.7)/3.4);ctx.beginPath();ctx.moveTo(pts[a][0],pts[a][1]);ctx.lineTo(pts[b][0],pts[b][1]);ctx.stroke();}
  ctx.globalAlpha=1;
}
function bg(){
  ctx.clearRect(0,0,W,H);
  wire(W*0.84,H*0.16,Math.min(W,H)*0.16,S.t*0.31,S.t*0.47,"#ff2bd6",.7);
  wire(W*0.1,H*0.82,Math.min(W,H)*0.1,-S.t*0.4,S.t*0.25,"#34f5ff",.55);
  /* floating shaded sphere */
  const sx=W*0.12,sy=H*0.2+Math.sin(S.t*0.8)*6,sr=Math.min(W,H)*0.055;
  const sg=ctx.createRadialGradient(sx-sr*0.4,sy-sr*0.4,sr*0.1,sx,sy,sr);sg.addColorStop(0,"#fff");sg.addColorStop(.35,"#c6ff3d");sg.addColorStop(1,"#1f5a10");
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
  for(const [x,y,s,k] of SPECKS){const yy=((y*H+S.t*12*s)%H);ctx.fillStyle=["#ff2bd6","#34f5ff","#c6ff3d","#ffffff"][k];ctx.globalAlpha=.35;ctx.fillRect(x*W,H-yy,s,s);}ctx.globalAlpha=1;
}
function poly(pts,fill){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function tile(r,c){
  const v=G[r][c];if(v===null)return;
  let [x,y]=pos(r,c);y+=floatY(r,c);
  const k=key(r,c),visited=S.visited.has(k),cur=PATH[S.step],isCur=cur[0]===r&&cur[1]===c;
  const reach=!S.done&&!S.jump&&adj(cur,[r,c])&&!visited;
  const bad=S.bad===k&&S.badT>0;
  const hw=TW/2*0.9,hh=TH/2*0.9,d=DEP;
  const top=[[x,y-hh],[x+hw,y],[x,y+hh],[x-hw,y]];
  /* sides */
  poly([[x-hw,y],[x,y+hh],[x,y+hh+d],[x-hw,y+d]],visited?"#5a7a12":bad?"#7a1028":"#1c1442");
  poly([[x+hw,y],[x,y+hh],[x,y+hh+d],[x+hw,y+d]],visited?"#3c5508":bad?"#4f0a1a":"#120d2e");
  /* top */
  let g=ctx.createLinearGradient(x-hw,y-hh,x+hw,y+hh);
  if(visited){g.addColorStop(0,"#e8ff9a");g.addColorStop(1,"#9ed61f");}
  else if(bad){g.addColorStop(0,"#ff7a95");g.addColorStop(1,"#c0163c");}
  else if(v==="X"){g.addColorStop(0,"#2a1d60");g.addColorStop(1,"#170f3a");}
  else{g.addColorStop(0,"#3a2c86");g.addColorStop(.55,"#251a5e");g.addColorStop(1,"#1a1246");}
  poly(top,g);
  /* rim */
  ctx.lineWidth=reach?2:1;
  if(reach){const p=reduced?.8:.55+.45*Math.sin(S.t*5);ctx.strokeStyle=`rgba(52,245,255,${p})`;ctx.shadowColor="#34f5ff";ctx.shadowBlur=12;}
  else ctx.strokeStyle=visited?"rgba(255,255,255,.55)":"rgba(170,150,255,.35)";
  ctx.beginPath();top.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();ctx.shadowBlur=0;
  /* glass shine */
  ctx.globalAlpha=visited?.35:.18;poly([[x,y-hh],[x+hw*0.55,y-hh*0.45],[x-hw*0.05,y+hh*0.1],[x-hw*0.6,y-hh*0.4]],"#ffffff");ctx.globalAlpha=1;
  /* label */
  if(typeof v==="number"&&!isCur){
    ctx.font=`800 ${Math.round(TW*0.2)}px "JetBrains Mono", ui-monospace, monospace`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=visited?"#1d2a06":"#efeaff";ctx.fillText(String(v),x,y+1);
  }
  if(v==="S"&&!isCur){ctx.font=`700 ${Math.round(TW*0.15)}px "JetBrains Mono", monospace`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=visited?"#1d2a06":"#efeaff";ctx.fillText("СТАРТ",x,y+1);}
  if(v==="X")portal(x,y);
}
function portal(x,y){
  const open=S.step>=STEPS,p=reduced?1:1+0.08*Math.sin(S.t*4);
  const rx=TW*0.3*p,ry=TH*0.3*p;
  if(open){
    const beam=ctx.createLinearGradient(0,y-TW*1.1,0,y);beam.addColorStop(0,"rgba(52,245,255,0)");beam.addColorStop(1,"rgba(255,43,214,.55)");
    ctx.fillStyle=beam;ctx.fillRect(x-rx*0.8,y-TW*1.1,rx*1.6,TW*1.1);
  }
  ctx.lineWidth=open?3:2;
  ctx.strokeStyle=open?"#ff2bd6":"rgba(255,255,255,.25)";ctx.shadowColor="#ff2bd6";ctx.shadowBlur=open?18:0;
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=open?"#34f5ff":"rgba(255,255,255,.15)";ctx.beginPath();ctx.ellipse(x,y,rx*0.62,ry*0.62,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
  if(!open){ctx.font=`700 ${Math.round(TW*0.13)}px "JetBrains Mono", monospace`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="rgba(255,255,255,.45)";ctx.fillText("УР. 2",x,y);}
}
function avatar(x,y){
  const s=TW*0.15,bob=reduced?0:Math.sin(S.t*3)*TW*0.025,cy=y-TW*0.27+bob;
  ctx.fillStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.ellipse(x,y+2,s*0.9,s*0.42,0,0,Math.PI*2);ctx.fill();
  const gl=ctx.createRadialGradient(x,cy,0,x,cy,s*2.6);gl.addColorStop(0,"rgba(255,43,214,.45)");gl.addColorStop(1,"rgba(255,43,214,0)");ctx.fillStyle=gl;ctx.fillRect(x-s*2.6,cy-s*2.6,s*5.2,s*5.2);
  const a=S.t*1.6,ca=Math.cos(a),sa=Math.sin(a);
  const T=[x,cy-s*1.35],B=[x,cy+s*1.05];
  const ring=[0,1,2,3].map(i=>{const ang=a+i*Math.PI/2;return[x+Math.cos(ang)*s,cy+Math.sin(ang)*s*0.38,Math.sin(ang)];});
  const faces=[];
  for(let i=0;i<4;i++){const p=ring[i],q=ring[(i+1)%4],z=(p[2]+q[2])/2;faces.push([z,[T,p,q],i],[z,[B,p,q],i+4]);}
  faces.sort((m,n)=>m[0]-n[0]);
  const cols=["#ff2bd6","#ff7ae6","#34f5ff","#9bfbff","#a0109a","#d23cc0","#0fa3b0","#2cd3e0"];
  for(const [z,pts,i] of faces){poly(pts,cols[i]);ctx.globalAlpha=.25+.25*z;ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);ctx.lineTo(pts[1][0],pts[1][1]);ctx.lineTo(pts[2][0],pts[2][1]);ctx.closePath();ctx.stroke();ctx.globalAlpha=1;}
  void ca;void sa;
}
function frame(){
  bg();
  ctx.save();
  if(S.shake>0)ctx.translate((Math.random()-.5)*10*S.shake,(Math.random()-.5)*6*S.shake);
  /* avatar position */
  let ar,ac,ax,ay;
  const cur=PATH[S.step];
  if(S.jump){
    const j=S.jump,k=Math.min(1,j.t),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const [x1,y1]=pos(...j.from),[x2,y2]=pos(...j.to);
    ax=x1+(x2-x1)*e;ay=y1+(y2-y1)*e-Math.sin(k*Math.PI)*TW*0.5;
    ar=k<.5?j.from[0]:j.to[0];ac=k<.5?j.from[1]:j.to[1];
  }else{ar=cur[0];ac=cur[1];[ax,ay]=pos(ar,ac);ay+=floatY(ar,ac);}
  const order=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G[r][c]!==null)order.push([r+c,r,c]);
  order.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const akey=ar+ac+0.5;let drawn=false;
  for(const [s,r,c] of order){if(!drawn&&s>akey){avatar(ax,ay);drawn=true;}tile(r,c);}
  if(!drawn)avatar(ax,ay);
  ctx.restore();
  /* glitch slices */
  if(S.glitch>0&&!reduced){
    const dpr=cv.width/W;
    for(let i=0;i<7;i++){const y=Math.random()*H,h=4+Math.random()*22,dx=(Math.random()-.5)*40*S.glitch;
      ctx.drawImage(cv,0,y*dpr,cv.width,h*dpr,dx,y,W,h);}
    ctx.fillStyle=`rgba(255,43,214,${S.glitch*0.18})`;ctx.fillRect(0,0,W,H);
  }
}

/* ---------- input ---------- */
function hit(px,py){
  let best=null,bs=-1;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(G[r][c]===null)continue;
    let [x,y]=pos(r,c);y+=floatY(r,c);
    if(Math.abs(px-x)/(TW/2)+Math.abs(py-y)/(TH/2)<=1.05&&r+c>bs){best=[r,c];bs=r+c;}
  }
  return best;
}
cv.addEventListener("pointerdown",e=>{
  if(S.done||S.jump)return;
  const rect=cv.getBoundingClientRect(),h=hit(e.clientX-rect.left,e.clientY-rect.top);
  if(!h)return;
  const cur=PATH[S.step],k=key(...h);
  if(h[0]===cur[0]&&h[1]===cur[1])return;
  if(!adj(cur,h)){toast("Прыгать можно только на соседнюю плиту","bad");return;}
  if(S.visited.has(k)){toast("Здесь ты уже был","bad");return;}
  const nxt=PATH[S.step+1];
  if(h[0]===nxt[0]&&h[1]===nxt[1]){S.jump={from:cur,to:h,t:0};return;}
  if(S.step>=STEPS){toast("Ищи светящийся портал","bad");return;}
  S.lives--;S.bad=k;S.badT=.6;S.shake=1;S.glitch=1;renderUI();
  toast(`Сбой! ${G[h[0]][h[1]]} — не тот год`,"bad");
  if(navigator.vibrate)try{navigator.vibrate(80);}catch(_){}
  if(S.lives<=0){S.done=true;setTimeout(fail,650);}
});

function landed(){
  const to=S.jump.to;S.jump=null;
  S.visited.add(key(...to));
  if(S.step<STEPS)toast(`✓ ${G[to[0]][to[1]]} — верно!`,"ok");
  S.step++;
  if(S.step>STEPS){S.done=true;S.step=STEPS;win();return;}
  renderUI();
}
function win(){
  renderUI();
  const ov=$("#ov");ov.hidden=false;
  ov.innerHTML=`<div class="card"><span class="k">УРОВЕНЬ 1 ПРОЙДЕН</span><h2>История собрана</h2>
    <p>${STEPS} из ${STEPS} событий на своих местах. Жизней осталось: ${S.lives} из 3.</p>
    <div class="next"><span class="ico">2</span><span><small>ОТКРЫТ НОВЫЙ УРОВЕНЬ</small><b>«Вектор»: векторное изображение</b></span></div>
    <button class="btn" id="again">Пройти заново</button></div>`;
  $("#again").onclick=reset;
}
function fail(){
  const ov=$("#ov");ov.hidden=false;
  ov.innerHTML=`<div class="card"><span class="k" style="color:#ff8fb0">СБОЙ СИСТЕМЫ</span><h2>Пиксели закончились</h2>
    <p>Ты прошёл ${S.step} из ${STEPS} событий. Попробуй ещё раз, теперь ты знаешь больше.</p>
    <button class="btn" id="again">Начать заново</button></div>`;
  $("#again").onclick=reset;
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*3);
  if(S.glitch>0)S.glitch=Math.max(0,S.glitch-dt*2.2);
  if(S.badT>0)S.badT-=dt;
  if(S.jump){S.jump.t+=dt*2.6;if(S.jump.t>=1)landed();}
  if(W)frame();
  requestAnimationFrame(loop);
}
reset();fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
requestAnimationFrame(loop);
})();
</script>
</body></html>
